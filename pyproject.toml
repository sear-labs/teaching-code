[build-system]
requires = ["setuptools>=68,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "orteach"
version = "0.1.0"
description = "Teaching models for IE 3315, IE 5301 and REE 4301 — the package half of the notebook/package split"
requires-python = ">=3.10,<3.14"

# Pinned with upper bounds (standard Part 1 rule 3). An unpinned dependency will
# one day install a major version with a changed API and either break or, worse,
# silently alter results.
dependencies = [
    "gurobipy>=11,<14",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    # Test-only, and the lower bound is load-bearing rather than tidy: pandas 3
    # changed the signature of `deprecate_kwarg`, which statsmodels 0.14.x calls
    # at import time, so 0.14.x raises TypeError on import against a pandas-3
    # environment. 0.15 is the first release that survives it.
    #
    # It is here rather than in `dependencies` because neither the package nor
    # any notebook imports statsmodels -- one test does, as an independent
    # cross-check of the OLS standard errors.
    "statsmodels>=0.15,<1",
]
# `pandas` is deliberately absent from both lists. Nothing in `src/` imports it,
# and exactly one notebook does; the package's own tables are plain dicts of
# columns, which is why `inf.load_table` returns one. Declaring pandas here would
# claim a dependency the library does not have.

# This file exists so `pip install -e .` works, which is what makes the Colab
# path possible: a notebook there installs the package and imports it, rather
# than carrying a vendored copy of every model. It also removes all sys.path
# fragility — the notebooks currently prepend ../../src, which works locally and
# is the first thing to fail somewhere else.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

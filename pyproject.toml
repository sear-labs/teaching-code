[build-system]
requires = ["setuptools>=68,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "orteach"
version = "0.1.0"
description = "Teaching models for IE 3315, IE 5301 and REE 4301 — the package half of the notebook/package split"
requires-python = ">=3.10,<3.14"

# Pinned with upper bounds (standard Part 1 rule 3). An unpinned dependency will
# one day install a major version with a changed API and either break or, worse,
# silently alter results.
dependencies = [
    "gurobipy>=11,<14",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    # Test-only, and the lower bound is load-bearing rather than tidy: pandas 3
    # changed the signature of `deprecate_kwarg`, which statsmodels 0.14.x calls
    # at import time, so 0.14.x raises TypeError on import against a pandas-3
    # environment. 0.15 is the first release that survives it.
    #
    # It is here rather than in `dependencies` because neither the package nor
    # any notebook imports statsmodels -- one test does, as an independent
    # cross-check of the OLS standard errors.
    "statsmodels>=0.15,<1",
    # CI lints with it (.github/workflows/ci.yml). Pinned to a minor series
    # because ruff adds rules between minors, and a lint that goes red on an
    # unrelated push gets switched off.
    "ruff>=0.15,<0.16",
    # tests/test_dependencies.py reads this file. tomllib is standard library from 3.11; on
    # 3.10 the backport is declared rather than skipped, so the guard always runs.
    "tomli>=2,<3; python_version < '3.11'",
]
# Only `12_energy_systems_pypsa` and the PyPSA half of tests/test_energy.py need
# this. It is an extra rather than a dependency because PyPSA 1.3 requires
# pandas 3, and forcing that on every install is how the authoring machine ended
# up with a separate kernel for one notebook. CI installs it in its own job.
energy = [
    "pypsa>=1.3,<2",
    "pandas>=3,<4",
    # The notebook's Explore section uses sliders. Colab ships ipywidgets; a
    # local kernel needs it declared.
    "ipywidgets>=8,<9",
]
# `pandas` is deliberately absent from `dependencies` and `dev`. Nothing in
# `src/` imports it, and the only notebook that does is 12, whose extra above
# declares it; the package's own tables are plain dicts of columns, which is why
# `inf.load_table` returns one. Declaring pandas there would claim a dependency
# the library does not have.

# This file exists so `pip install -e .` works, which is what makes the Colab
# path possible: a notebook there installs the package and imports it, rather
# than carrying a vendored copy of every model. It also removes all sys.path
# fragility — the notebooks currently prepend ../../src, which works locally and
# is the first thing to fail somewhere else.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Notebooks are narrative, not modules: a teaching cell that repeats itself or
# keeps a knob inline is correct there (standard Part 4), and a linter would
# flag exactly that. tools/check_notebooks.py is what guards them.
extend-exclude = ["notebooks"]
